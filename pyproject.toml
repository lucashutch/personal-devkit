[project]
name = "personal-devkit"
version = "0.1.0"
description = "Personal developer toolkit scripts for OpenCode, Claude Code, Herdr, and dotfiles."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py311"

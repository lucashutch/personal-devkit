onboarding = false
# Herdr configuration managed by personal-devkit.
# See https://herdr.dev/docs/configuration/ for available settings.

[keys]
# Leave ctrl+b free for the agent CLIs' own background shortcut.
prefix = "ctrl+space"

# Herdr 0.9.1 downgrades modified Enter to a bare CR for panes that have not
# requested enhanced key encoding, so ctrl+enter reaches agent CLIs as a plain
# newline. Re-send it as alt+enter, which needs no enhanced encoding.
[[keys.command]]
key = "ctrl+enter"
type = "shell"
command = "$HERDR_BIN_PATH pane send-keys $HERDR_ACTIVE_PANE_ID alt+enter"
description = "submit prompt (ctrl+enter shim)"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[ui]
# Put agents needing attention at the top of the agent panel.
agent_panel_sort = "priority"
sidebar_width = 30
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = false

status_indicators = "symbols"
[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.sound]
enabled = true

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "machine", fg = "#abb2bf", bold = true, dim = false, rules = [{ equals = "Local", fg = "#61afef" }, { equals = "maul", fg = "#d19a66" }, { equals = "devbox", fg = "#c678dd" }] }, "workspace", "tab"],
  ["agent"],
]

[session]
resume_agents_on_restore = true

[experimental]
kitty_graphics = true
pane_history = true

[advanced]
scrollback_limit_bytes = 30000000

[theme]
name = "one-dark"
auto_switch = false

[theme.custom]
# Herdr applies terminal dimming to secondary agent labels. Raise the base
# color so those labels remain readable in Windows Terminal.
overlay0 = "#abb2bf"

version: 1
groups:
  opencode:
  - source: opencode/default
    destinations:
    - $CONFIG_HOME/opencode/opencode
    include:
    - "*.json"
    - "plugins/**"
  - source: opencode/test
    destinations:
    - $CONFIG_HOME/opencode-test/opencode
    include:
    - "*.json"
    - "plugins/**"
    exclude:
    - __pycache__
    - "*.pyc"
  - source: opencode/shared
    destinations:
    - $CONFIG_HOME/opencode/opencode
    - $CONFIG_HOME/opencode-test/opencode
    include:
    - cli.json
    - "agents/**"
  - source: opencode/shared
    destinations:
    - $CONFIG_HOME/opencode/opencode/shared
    - $CONFIG_HOME/opencode-test/opencode/shared

  # Skills are platform-neutral: one copy in agentic_common, linked everywhere.
  - source: agentic_common/skills
    destinations:
    - $CONFIG_HOME/opencode/opencode/skills
    - $CONFIG_HOME/opencode-test/opencode/skills
  # Commands are OpenCode-only on purpose: they exist to expose a skill as a
  # slash command, and Claude Code already surfaces every skill as one. Linking
  # them into ~/.claude would create a duplicate /ship, /start, and so on.
  - source: agentic_common/commands
    destinations:
    - $CONFIG_HOME/opencode/opencode/commands
    - $CONFIG_HOME/opencode-test/opencode/commands
  - source: agentic_common/user-instructions.md
    destinations:
    - $CONFIG_HOME/opencode/opencode/AGENTS.md
    - $CONFIG_HOME/opencode-test/opencode/AGENTS.md

  claude:
  - source: claude
    destinations:
    - $HOME/.claude
    include:
    - "**"
  - source: agentic_common/skills
    destinations:
    - $HOME/.claude/skills
  - source: agentic_common/user-instructions.md
    destinations:
    - $HOME/.claude/CLAUDE.md

  herdr:
  - source: herdr
    destinations:
    - $CONFIG_HOME/herdr
    include:
    - config.toml

  dotfiles:
  - source: dotfiles
    destinations:
    - $CONFIG_HOME
    include:
    - starship.toml
    - "ghostty/**"
    - "bashrc.d/**"
  - source: dotfiles/.asoundrc
    destinations:
    - $HOME/.asoundrc

version: 1
groups:
  opencode:
  - source: opencode/default
    destinations:
    - $CONFIG_HOME/opencode
    include:
    - "*.json"
  - source: opencode/test
    destinations:
    - $CONFIG_HOME/opencode-test/opencode
    include:
    - "*.json"
    exclude:
    - __pycache__
    - "*.pyc"
  - source: opencode
    destinations:
    - $CONFIG_HOME/opencode
    - $CONFIG_HOME/opencode-test/opencode
    include:
    - cli.json
    - "agents/**"
    - "lib/**"
  - source: opencode/plugins
    destinations:
    - $CONFIG_HOME/opencode/extensions
    - $CONFIG_HOME/opencode-test/opencode/extensions

  # Skills are platform-neutral: one copy in agentic_common, linked everywhere.
  - source: agentic_common/skills
    destinations:
    - $CONFIG_HOME/opencode/skills
    - $CONFIG_HOME/opencode-test/opencode/skills
  - source: agentic_common/user-instructions.md
    destinations:
    - $CONFIG_HOME/opencode/AGENTS.md
    - $CONFIG_HOME/opencode-test/opencode/AGENTS.md

  claude:
  - source: claude
    destinations:
    - $CLAUDE_CONFIG_DIR
    include:
    - "**"
  - source: agentic_common/skills
    destinations:
    - $CLAUDE_CONFIG_DIR/skills
  - source: agentic_common/user-instructions.md
    destinations:
    - $CLAUDE_CONFIG_DIR/CLAUDE.md

  herdr:
  - source: herdr
    destinations:
    - $CONFIG_HOME/herdr
    include:
    - config.toml
  - source: herdr-auto-title
    destinations:
    - $CONFIG_HOME/herdr-auto-title
    include:
    - config.env

  dotfiles:
  - source: dotfiles
    destinations:
    - $CONFIG_HOME
    include:
    - starship.toml
    - "ghostty/**"
    - "bashrc.d/**"
  - source: dotfiles/.asoundrc
    destinations:
    - $HOME/.asoundrc
